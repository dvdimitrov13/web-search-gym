# Cloud config: Gemma 4 E4B + LoRA, RTX 5090 (32GB) on vast.ai.
#
# Memory budget @ seq=16384, bf16, LoRA rank=16, gradient_checkpointing=true:
#   - model weights bf16:  ~9  GB
#   - LoRA adapters+grads: <0.2 GB
#   - AdamW state (LoRA):  ~0.3 GB
#   - activations (GC on): ~10-15 GB
#   total:                 ~20-25 GB  (fits 32 GB with headroom)
#
# 400-task synth → ~7k training samples (4.3k searcher + 2.7k extractor).
# 1 epoch at per_device_batch=1, grad_accum=8 → ~880 optimizer steps.
# Wall ~4-6h on a 5090 at seq=16k (dominated by attention).

model:
  name: "google/gemma-4-E4B-it"

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: "all-linear"

training:
  output_dir: "sft/checkpoints/gemma4_e4b_mixed"
  save_dir: "sft/output/gemma4_e4b_mixed"
  epochs: 2
  batch_size: 3
  gradient_accumulation: 6  # effective batch = 18
  learning_rate: 2.0e-5
  lr_scheduler: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.0
  # Gemma 4 E4B-it is 7.99B params (vision tower bundled, ~16 GB bf16) and
  # has a 262k vocab. The `logits.float()` upcast in the loss path is
  # (seq × 262k × 4 bytes) — at seq=32k that's 34 GB just for the fp32
  # logits, plus another ~30 GB for CE backward. Liger's fused chunked CE
  # avoids materializing full logits, cutting this to ~1 GB. Required on
  # 96 GB RTX PRO 6000 WS at seq=32k. Real measured tokenized coverage:
  # seq=32k = 98.4% samples fit natively; p95 searcher 18.7k / extractor
  # 32.2k; max 80.9k (a rare extractor outlier).
  max_seq_length: 24576
  # Liger-Kernel 0.7.0 doesn't register gemma4, so TRL's `use_liger_kernel`
  # would no-op. We apply a custom monkey-patch (sft/gemma4_liger_patch.py)
  # that wires Liger's fused linear-CE directly into Gemma4's forward,
  # avoiding the (B,T,262k) fp32 logits allocation that OOMed at seq≥24k.
  use_liger_kernel: false
  drop_too_long: true
  # Custom packed-sequence collator: greedy first-fit packs samples, builds
  # 4D block-diagonal attention mask + resets position_ids. Eliminates
  # padding waste at batch>1 without needing flash-attn varlen. See
  # sft/packing.py. Requires attn_implementation=sdpa_memeff (respects 4D mask).
  custom_packing: true
  # Gemma 4 head_dim=320 needs forced torch SDPA EFFICIENT_ATTENTION (CUTLASS
  # mem-eff, O(seq) memory). FLASH rejects head_dim>256, CUDNN rejects on
  # sm_120, and MATH fallback hits 74 GB at seq=32k. `sdpa_memeff` is our
  # custom ALL_ATTENTION_FUNCTIONS registration that wraps SDPA in a
  # context manager pinning EFFICIENT_ATTENTION only; see sft/gemma4_liger_patch.py.
  attn_implementation: "sdpa_memeff"
  logging_steps: 10
  save_strategy: "steps"
  save_steps: 50
  save_total_limit: 2  # keep only latest 2 checkpoints to stay under 29 GB disk
  bf16: true
  gradient_checkpointing: true
  wandb_project: "web-search-gym-sft"
  wandb_run_name: "gemma4-e4b-mixed-seq24k-bs3ga6-packed-v1"
