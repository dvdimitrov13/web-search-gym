# Tiny local smoke config: Qwen3-0.6B + LoRA, ~5 optimizer steps.
# Purpose: verify the end-to-end pipeline (load data → template → tokenize →
# forward/backward → save) runs without errors on M-series MPS. Not a quality
# signal — loss will not converge in 5 steps.
#
# For real training on vast.ai, see config_cloud.yaml (Gemma 4 E4B + RTX 5090).

model:
  name: "Qwen/Qwen3-0.6B"

lora:
  rank: 8
  alpha: 16
  dropout: 0.0
  target_modules: "all-linear"

training:
  output_dir: "sft/checkpoints/smoke"
  save_dir: "sft/output/smoke"
  epochs: 1
  batch_size: 1
  gradient_accumulation: 2
  learning_rate: 2.0e-5
  lr_scheduler: "constant"
  warmup_ratio: 0.0
  weight_decay: 0.0
  max_seq_length: 4096  # our prompts (with tools block) tokenize to ~2-3k; completion sits at the end — truncation below 3k loses all loss signal
  logging_steps: 1
  save_strategy: "no"
  save_steps: 1000  # irrelevant with save_strategy=no
  bf16: false  # MPS bf16 training path is unstable (NaN grad); fp32 at 0.6B fits in 20GB
  gradient_checkpointing: true
  max_steps: 3  # hard cap for smoke
